spring.kafka.consumer.group-id=kathalife-memory-embedding-consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kathalife.memory.consumer.dto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

kathalife.internal.api-key=your-secret-api-key
kathalife.rag.top-k=5
kathalife.rag.similarity-threshold=0.5
